services:
  - type: web
    name: passmanager
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py bootstrap_superuser && gunicorn passmanager.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SITE_URL
        value: https://qr-pass-manager-bxgq.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: passmanager-db
          property: connectionString

databases:
  - name: passmanager-db
    plan: free
