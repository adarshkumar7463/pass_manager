services:
  - type: web
    name: passmanager
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn passmanager.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SITE_URL
        value: https://passmanager.onrender.com # Update this after first deployment
      - key: DATABASE_URL
        fromDatabase:
          name: passmanager-db
          property: connectionString

databases:
  - name: passmanager-db
    plan: free
